services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zephyr
      POSTGRES_USER: zephyr
      POSTGRES_PASSWORD: zephyr
    ports:
      - "5432:5432"
    volumes:
      - zephyr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zephyr"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zephyr-postgres:
