services:
  - type: web
    name: zephyr
    runtime: docker
    plan: starter
    region: ohio
    repo: https://github.com/solidsgroup/zephyr
    branch: master
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    preDeployCommand: zephyr-migrate
    domains:
      - zephyr.solids.group
    envVars:
      - key: ZEPHYR_ENV
        value: production
      - key: ZEPHYR_DATABASE_URL
        fromDatabase:
          name: zephyr-db
          property: connectionString
      - key: ZEPHYR_PUBLIC_URL
        value: https://zephyr.solids.group
      - key: ZEPHYR_GOOGLE_ALLOWED_DOMAIN
        value: solids.group
      - key: ZEPHYR_SESSION_SECRET
        generateValue: true
      - key: ZEPHYR_TOKEN_PEPPER
        generateValue: true
      - key: ZEPHYR_GOOGLE_CLIENT_ID
        sync: false
      - key: ZEPHYR_GOOGLE_CLIENT_SECRET
        sync: false
      - key: ZEPHYR_ARTIFACT_STORE
        value: google_drive
      - key: ZEPHYR_GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: ZEPHYR_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: zephyr-db
    databaseName: zephyr
    user: zephyr
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
